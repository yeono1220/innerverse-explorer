name: build-vllm-git

on:
  push:
    branches: [ yejinTest, yejin ]
    paths: [ 'docker/Dockerfile', '.github/workflows/build-image.yml' ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name : Set lowercase owner
        run : echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
        
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:  .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/vllm-dev:latest
            ghcr.io/${{ env.OWNER }}/vllm-dev:${{github.sha}}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{github.repository}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
