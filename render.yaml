# Render Blueprint — INNERVERSE AI 백엔드 (FastAPI)
# 대시보드에서 이 레포 연결 → Blueprint 감지 → sync:false 항목만 채우면 됨.
#
# ⚠️ 변경점
#   1) startCommand: `uvicorn backend.main:app` 은 부팅에 실패한다.
#      main.py 가 `from config import ...` 처럼 평면 임포트를 쓰기 때문에
#      backend/ 가 작업 디렉터리여야 한다 → `cd backend && uvicorn main:app`.
#   2) 인증 환경변수(APP_ENV / AUTH_MODE / SUPABASE_*) 추가.
#      APP_ENV=production 이면 인증 우회와 CORS 와일드카드가 부팅 단계에서 차단된다.
services:
  - type: web
    name: innerverse-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ── 인증 ──
      - key: APP_ENV
        value: production          # 인증 우회/CORS 와일드카드를 금지하는 스위치
      - key: AUTH_MODE
        value: supabase            # production 에서는 이 값만 허용됨
      - key: AUTH_REQUIRE_VERIFIED_EMAIL
        value: "true"

      # ── 아래는 대시보드에서 직접 입력 (시크릿/도메인) ──
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS       # 프론트 도메인 (예: https://innerverse.vercel.app)
        sync: false
      - key: SUPABASE_URL          # https://xxxx.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY     # Settings > API > anon public key
        sync: false
      - key: SUPABASE_JWT_SECRET   # Settings > API > JWT Secret (HS256 프로젝트)
        sync: false
      # 새 프로젝트(비대칭 서명, ES256)라면 JWT_SECRET 대신 아래를 쓰세요.
      # - key: SUPABASE_JWKS_URL
      #   sync: false
